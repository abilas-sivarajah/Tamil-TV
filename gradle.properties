org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# ---------------------------------------------------------------------------
# Adresse deines Backends. Muss mit "/" enden.
# Emulator -> http://10.0.2.2:8000/   |   echter Fire TV Stick -> LAN-IP des PCs
# ---------------------------------------------------------------------------
tvclient.apiBaseUrl=http://192.168.178.23:8000/

# GitHub-Repo, dessen Releases die App als Update anbietet ("owner/repo")
tvclient.updateRepo=abilas-sivarajah/Tamil-TV

# App-Version (der Release-Workflow setzt sie beim Bauen automatisch aus dem Git-Tag)
appVersionName=1.1.0
appVersionCode=10100
